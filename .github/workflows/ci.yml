name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts
          cache: true

      - name: Install
        run: deno install

      - name: Format
        run: deno task fmt:chk

      - name: Lint
        run: deno lint

      - name: Typecheck
        run: deno check mod.ts

      - name: Test
        run: deno task test

  release:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo tools
        run: |
          WASM_BINDGEN_VERSION=$(awk '/^name = "wasm-bindgen"$/{f=1} f && /^version/{gsub(/"/, "", $3); print $3; exit}' Cargo.lock)
          echo "Installing wasm-bindgen-cli@${WASM_BINDGEN_VERSION}"
          cargo binstall --no-confirm "wasm-bindgen-cli@${WASM_BINDGEN_VERSION}"

      - name: Install
        run: deno install

      - name: Build
        run: deno task build

      - name: Publish
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' deno.jsonc > deno.tmp.jsonc && mv deno.tmp.jsonc deno.jsonc
          deno publish --allow-dirty
